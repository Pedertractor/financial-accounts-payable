info:
  name: list users
  type: http
  seq: 2

http:
  method: GET
  url: "{{HOST}}/users"
  params:
    - name: active
      value: "true"
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{TOKEN}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("deve retornar 200", function () {
          expect(res.status).to.equal(200);
        });
        test("deve conter array users", function () {
          expect(res.body).to.have.property("users");
          expect(res.body.users).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
