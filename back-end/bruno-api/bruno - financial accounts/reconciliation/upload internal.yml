info:
  name: upload internal
  type: http
  seq: 4

http:
  method: POST
  url: "{{HOST}}/reconciliation/runs/{{RUN_ID}}/uploads/internal"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value: "{{FILE_INTERNAL_PATH}}"
  auth:
    type: bearer
    token: "{{TOKEN}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body && res.body.fileUploadId) {
          bru.setVar("FILE_UPLOAD_ID", res.body.fileUploadId);
        }
    - type: tests
      code: |-
        test("deve retornar 201 ao receber o arquivo", function () {
          expect(res.status).to.equal(201);
        });
        test("deve conter fileUploadId", function () {
          expect(res.body).to.have.property("fileUploadId");
        });

docs: |-
  Multipart: campo **`file`** (exportação Epron / sistema interno).
  Ajuste `FILE_INTERNAL_PATH` no environment.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
