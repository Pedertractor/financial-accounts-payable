  postgresql-financial-accounts-payable:
    image: postgres:16
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DB=financial-accounts-payable

    networks:
      - financial-accounts-payable-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
