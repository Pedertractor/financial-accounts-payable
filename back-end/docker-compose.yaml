name: project-financial-accounts-payable
services:
  project-financial-accounts-payable-back-end:
    build: .
    container_name: project-financial-accounts-payable-back-end
    restart: always
    ports:
      - 3135:3030
    env_file:
      - .env
    depends_on:
      - project-financial-accounts-payable-database

  project-financial-accounts-payable-database:
    image: postgres:16
    container_name: project-financial-accounts-payable-database
    ports:
      - 5438:5432
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DB=financial-accounts-payable
