name: project-financial-accounts-payable
services:
  project-financial-accounts-payable-front-end:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project-financial-accounts-payable-front-end
    ports:
      - '3134:80'
    networks:
      - project-financial-accounts-payable-network

networks:
  project-financial-accounts-payable-network:
    external: true
    name: project-financial-accounts-payable-network
